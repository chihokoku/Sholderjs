<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shoulderjs</title>
    <!-- 以下の1行を追加でthree.jsが使える -->
    <script src="https://unpkg.com/three@0.147.0/build/three.min.js"></script>
    <!-- <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script> -->
    <!-- 以下の一行でカメラのズームイン・アウト、回転ができるようになる -->
    <script src="https://unpkg.com/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
    <!-- objファイルを読み込ませるためのCDN -->
    <script src="https://unpkg.com/three@0.147.0/examples/js/loaders/OBJLoader.js"></script>
    <!-- stlファイルを読み込ませるためのCDN -->
    <script src="https://unpkg.com/three@0.147.0/examples/js/loaders/STLLoader.js"></script>
    <!-- excelファイル出力するためのCDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.17.3/xlsx.full.min.js"></script>
    <script type="module" src="script.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/ress/dist/ress.min.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <div class="inner">
        <h1>Sholderjs</h1>
        <nav>
          <input type="file" id="fileInput" accept=".obj,.stl" />
        </nav>
      </div>
    </header>
    <main>
      <canvas id="canvas1" width="800" height="800"></canvas>
      <div id="ray_coordinate"></div>
      <div>
        <label
          >X:
          <input
            style="border-bottom: 1px solid black"
            type="number"
            id="x1"
            step="0.1"
            value="0"
        /></label>
        <label
          >Y:
          <input
            style="border-bottom: 1px solid black"
            type="number"
            id="y1"
            step="0.1"
            value="0"
        /></label>
        <label
          >Z:
          <input
            style="border-bottom: 1px solid black"
            type="number"
            id="z1"
            step="0.1"
            value="0"
        /></label>
      </div>
      <div>
        <label
          >X:
          <input
            style="border-bottom: 1px solid black"
            type="number"
            id="x2"
            step="0.1"
            value="0"
        /></label>
        <label
          >Y:
          <input
            style="border-bottom: 1px solid black"
            type="number"
            id="y2"
            step="0.1"
            value="0"
        /></label>
        <label
          >Z:
          <input
            style="border-bottom: 1px solid black"
            type="number"
            id="z2"
            step="0.1"
            value="0"
        /></label>
      </div>
      <div>
        <label
          >X:
          <input
            style="border-bottom: 1px solid black"
            type="number"
            id="x3"
            step="0.1"
            value="0"
        /></label>
        <label
          >Y:
          <input
            style="border-bottom: 1px solid black"
            type="number"
            id="y3"
            step="0.1"
            value="0"
        /></label>
        <label
          >Z:
          <input
            style="border-bottom: 1px solid black"
            type="number"
            id="z3"
            step="0.1"
            value="0"
        /></label>
        <button id="applyButton" style="border: 1px solid gray">
          座標を適用
        </button>
      </div>
    </main>
  </body>
</html>
